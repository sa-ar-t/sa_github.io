<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>موقع زملائي</title>
<style>
  :root { --bg:#000; --card:#0d0d0f; --card2:#141417; --text:#f5f5f7; --sub:#8e8e93;
          --line:#1f1f23; --accent:#fff; --accent-text:#000; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; background:var(--bg); }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; }

  .hero { padding:44px 16px 26px; text-align:center; border-bottom:1px solid var(--line); }
  .hero h1 { margin:0; font-size:1.9rem; font-weight:800; letter-spacing:.2px; }
  .hero p { margin:6px 0 0; color:var(--sub); font-size:.95rem; }

  .wrap { max-width:860px; margin:0 auto; padding:0 16px; }
  .search { margin-top:22px; }
  #q { width:100%; padding:14px 20px; border-radius:14px; border:1px solid var(--line);
       background:var(--card); color:var(--text); font-size:1rem; outline:none; }
  #q::placeholder { color:var(--sub); }
  #q:focus { border-color:#3a3a40; }

  .tabs { display:flex; gap:8px; margin:16px 0 4px; overflow-x:auto; padding-bottom:4px; }
  .tab { border:1px solid var(--line); background:transparent; color:var(--sub);
         padding:8px 18px; border-radius:10px; font-size:.92rem; cursor:pointer;
         white-space:nowrap; font-family:inherit; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:700; }

  h2 { font-size:1.05rem; margin:24px 0 12px; display:flex; align-items:center; gap:10px; font-weight:700; }
  h2 .count { background:var(--card2); color:var(--sub); font-size:.75rem;
              padding:1px 10px; border-radius:8px; font-weight:600; border:1px solid var(--line); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:16px; padding:14px; display:flex; gap:14px;
          align-items:center; border:1px solid var(--line); transition:border-color .15s; }
  .card:hover { border-color:#34343a; }
  .icon { width:60px; height:60px; border-radius:14px; flex-shrink:0; color:#fff;
          display:flex; align-items:center; justify-content:center;
          font-size:1.6rem; font-weight:800; overflow:hidden; }
  .icon img { width:100%; height:100%; object-fit:cover; display:block; }
  .info { flex:1; min-width:0; }
  .name { font-weight:700; font-size:1.02rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .desc { color:var(--sub); font-size:.84rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--sub); font-size:.76rem; margin-top:3px; }
  .meta span { unicode-bidi:isolate; }
  .btn { background:var(--accent); color:var(--accent-text); text-decoration:none; font-weight:700;
         padding:10px 20px; border-radius:12px; white-space:nowrap; font-size:.92rem; }
  .btn:active { transform:scale(.96); opacity:.85; }

  .sk { height:88px; border-radius:16px; border:1px solid var(--line);
        background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
        background-size:200% 100%; animation:sh 1.3s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }

  .msg { text-align:center; color:var(--sub); padding:40px 10px; }
  .retry { margin-top:12px; border:0; background:var(--accent); color:var(--accent-text);
           padding:9px 22px; border-radius:12px; font-weight:700; font-family:inherit; font-size:.92rem; }

  .note { margin:30px 0 10px; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:13px 16px; color:var(--sub); font-size:.84rem; }
  footer { text-align:center; color:#5a5a60; font-size:.78rem; padding:14px 16px 34px; }
</style>
</head>
<body>

<div class="hero">
  <h1>موقع زملائي</h1>
  <p>تطبيقات وكتب مجانية، حمّلها مباشرة</p>
</div>

<div class="wrap">
  <div class="search"><input id="q" type="search" placeholder="ابحث عن تطبيق أو كتاب"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
  <div class="note">للتثبيت: حمّل الملف ثم افتحه، وإن طلب منك أندرويد السماح بالتثبيت من هذا المصدر فوافق.</div>
</div>
<footer>© موقع زملائي</footer>

<script>
const REPO = "sa-ar-t/sa_github.io";
const BOOK_EXT = ["pdf", "epub", "doc", "docx"];
const IMG_EXT = ["png", "jpg", "jpeg", "webp"];
const CACHE_KEY = "zmlaey_releases_v1";
const TTL = 10 * 60 * 1000;

// اختياري: لتخصيص اسم ووصف أي ملف
// مثال:
// "Sa_th_sn.apk": { title: "كتاب العلوم الطبيعية", desc: "كتب مدرسية للدراسة" },
const info = {
};

let apps = [], books = [], tab = "all", query = "";

const $ = id => document.getElementById(id);
function ext(n) { return n.split(".").pop().toLowerCase(); }
function base(n) { return n.replace(/\.[^.]+$/, "").toLowerCase(); }
function color(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return "hsl(" + h + ",45%,38%)"; }
function sizeText(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function card(it, isBook) {
  const c = el("div", "card");
  const ic = el("div", "icon");
  ic.style.background = color(it.file);
  if (it.icon) {
    const img = document.createElement("img");
    img.src = it.icon; img.alt = "";
    img.onerror = () => { img.remove(); ic.textContent = isBook ? "📖" : it.title.charAt(0).toUpperCase(); };
    ic.appendChild(img);
  } else ic.textContent = isBook ? "📖" : it.title.charAt(0).toUpperCase();

  const inf = el("div", "info");
  inf.appendChild(el("div", "name", it.title));
  if (it.desc) inf.appendChild(el("div", "desc", it.desc));
  const m = el("div", "meta");
  m.append(el("span", null, it.size), el("span", null, "⬇ " + it.downloads), el("span", null, it.date));
  inf.appendChild(m);

  const b = el("a", "btn", isBook ? "تحميل" : "تثبيت");
  b.href = it.url;
  c.append(ic, inf, b);
  return c;
}

function renderTabs() {
  const t = $("tabs"); t.innerHTML = "";
  [["all", "الكل", apps.length + books.length], ["apps", "التطبيقات", apps.length], ["books", "الكتب", books.length]]
    .forEach(([k, label, n]) => {
      if (k !== "all" && n === 0) return;
      const b = el("button", "tab" + (tab === k ? " on" : ""), label + " (" + n + ")");
      b.onclick = () => { tab = k; renderTabs(); render(); };
      t.appendChild(b);
    });
}

function section(title, items, isBook) {
  const f = query.trim().toLowerCase();
  const shown = items.filter(i => (i.title + " " + (i.desc || "")).toLowerCase().includes(f));
  if (!shown.length) return null;
  const s = el("section");
  const h = el("h2", null, title);
  h.appendChild(el("span", "count", String(shown.length)));
  const g = el("div", "grid");
  shown.forEach(i => g.appendChild(card(i, isBook)));
  s.append(h, g);
  return s;
}

function render() {
  const out = $("content"); out.innerHTML = "";
  const parts = [];
  if (tab !== "books") parts.push(section("التطبيقات", apps, false));
  if (tab !== "apps") parts.push(section("الكتب", books, true));
  const ok = parts.filter(Boolean);
  if (!ok.length) { out.appendChild(el("div", "msg", apps.length + books.length ? "لا توجد نتائج" : "لا توجد ملفات بعد")); return; }
  ok.forEach(p => out.appendChild(p));
}

async function getReleases() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < TTL) return c.d;
  } catch (e) {}
  const r = await fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=30");
  if (!r.ok) throw new Error(r.status);
  const d = await r.json();
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  return d;
}

async function load() {
  try {
    const releases = await getReleases();
    const icons = {}, seen = {};
    releases.forEach(rel => {
      if (rel.draft) return;
      rel.assets.forEach(as => { if (IMG_EXT.indexOf(ext(as.name)) !== -1 && !icons[base(as.name)]) icons[base(as.name)] = as.browser_download_url; });
    });
    releases.forEach(rel => {
      if (rel.draft) return;
      rel.assets.forEach(as => {
        if (seen[as.name]) return;
        const e = ext(as.name), isApk = e === "apk", isBook = BOOK_EXT.indexOf(e) !== -1;
        if (!isApk && !isBook) return;
        seen[as.name] = true;
        const o = info[as.name] || {};
        const item = {
          file: as.name,
          title: o.title || as.name.replace(/\.[^.]+$/, "").replace(/[_.-]+/g, " "),
          desc: o.desc || "",
          icon: icons[base(as.name)] || "",
          url: as.browser_download_url,
          size: sizeText(as.size),
          downloads: as.download_count || 0,
          date: new Date(as.updated_at).toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" })
        };
        (isApk ? apps : books).push(item);
      });
    });
    renderTabs(); render();
  } catch (e) {
    const out = $("content"); out.innerHTML = "";
    const m = el("div", "msg", "تعذّر تحميل القائمة، أعد المحاولة بعد قليل");
    const b = el("button", "retry", "إعادة المحاولة");
    b.onclick = () => location.reload();
    m.append(document.createElement("br"), b);
    out.appendChild(m);
  }
}

$("q").addEventListener("input", e => { query = e.target.value; render(); });
load();
</script>
</body>
</html>
