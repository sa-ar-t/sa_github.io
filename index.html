<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقع زملائي</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1c1e26; --sub:#6b7080;
          --accent:#01875f; --line:#e4e7ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101319; --card:#1a1e27; --text:#eef0f6; --sub:#9aa0b2;
            --accent:#3ddc97; --line:#2a2f3b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
         background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--card);
           border-bottom:1px solid var(--line); padding:14px 16px 12px; }
  .bar { max-width:720px; margin:0 auto; }
  h1 { margin:0 0 10px; font-size:1.3rem; }
  #q { width:100%; padding:11px 16px; border-radius:24px; border:1px solid var(--line);
       background:var(--bg); color:var(--text); font-size:1rem; outline:none; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h2 { font-size:1.05rem; margin:6px 0 12px; }
  .list { display:grid; gap:12px; }
  .card { background:var(--card); border-radius:16px; padding:14px;
          display:flex; gap:14px; align-items:center;
          box-shadow:0 1px 6px rgba(0,0,0,.06); }
  .icon { width:60px; height:60px; border-radius:16px; color:#fff; flex-shrink:0;
          display:flex; align-items:center; justify-content:center;
          font-size:1.6rem; font-weight:700; }
  .info { flex:1; min-width:0; }
  .name { font-weight:700; font-size:1.05rem; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--sub); font-size:.82rem; margin-top:3px; }
  .btn { background:var(--accent); color:#fff; text-decoration:none; font-weight:700;
         padding:9px 20px; border-radius:20px; white-space:nowrap; }
  @media (prefers-color-scheme: dark) { .btn { color:#06281b; } }
  .msg { text-align:center; color:var(--sub); padding:40px 10px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>موقع زملائي</h1>
    <input id="q" type="search" placeholder="ابحث عن تطبيق">
  </div>
</header>

<main>
  <h2>التطبيقات</h2>
  <div id="list" class="list"><div class="msg">جاري التحميل...</div></div>
</main>

<script>
const REPO = "sa-ar-t/sa_github.io";

// اختياري: لتغيير الاسم الظاهر لتطبيق، اكتب اسم الملف ثم الاسم الذي تريده
// مثال:  "Sa_th_sn.apk": "كتاب العلوم الطبيعية",
const names = {
};

const list = document.getElementById("list");
let apps = [];

function colorFor(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360;
  return "hsl(" + h + ",60%,45%)";
}

function render(filter) {
  list.innerHTML = "";
  const f = (filter || "").trim().toLowerCase();
  const shown = apps.filter(a => a.title.toLowerCase().includes(f));
  if (!shown.length) {
    list.innerHTML = '<div class="msg">لا توجد تطبيقات</div>';
    return;
  }
  shown.forEach(a => {
    const card = document.createElement("div");
    card.className = "card";

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.style.background = colorFor(a.file);
    icon.textContent = a.title.charAt(0).toUpperCase();

    const info = document.createElement("div");
    info.className = "info";
    const n = document.createElement("div");
    n.className = "name";
    n.textContent = a.title;
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = a.size + " MB  •  " + a.date;
    info.append(n, m);

    const b = document.createElement("a");
    b.className = "btn";
    b.href = a.url;
    b.textContent = "تثبيت";

    card.append(icon, info, b);
    list.appendChild(card);
  });
}

async function load() {
  try {
    const r = await fetch("https://api.github.com/repos/" + REPO + "/releases");
    if (!r.ok) throw new Error(r.status);
    const releases = await r.json();
    const seen = {};
    releases.forEach(rel => {
      if (rel.draft) return;
      rel.assets.forEach(as => {
        if (!as.name.toLowerCase().endsWith(".apk") || seen[as.name]) return;
        seen[as.name] = true;
        apps.push({
          file: as.name,
          title: names[as.name] || as.name.replace(/\.apk$/i, "").replace(/[_.-]+/g, " "),
          url: as.browser_download_url,
          size: (as.size / 1048576).toFixed(1),
          date: new Date(as.updated_at).toLocaleDateString("ar")
        });
      });
    });
    render("");
  } catch (e) {
    list.innerHTML = '<div class="msg">تعذّر تحميل التطبيقات، أعد المحاولة بعد قليل</div>';
  }
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));
load();
</script>
</body>
</html>
