<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التطبيقات</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1e26; --accent:#2f6df6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1c1f28; --text:#eef0f6; --accent:#5b8cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
         background:var(--bg); color:var(--text); }
  main { max-width:520px; margin:0 auto; padding:24px 16px; display:grid; gap:14px; }
  .card { background:var(--card); border-radius:18px; padding:16px;
          box-shadow:0 2px 10px rgba(0,0,0,.07); display:flex; gap:14px; align-items:center; }
  .icon { width:52px; height:52px; border-radius:14px; background:var(--accent);
          color:#fff; display:flex; align-items:center; justify-content:center;
          font-size:1.5rem; flex-shrink:0; }
  .name { flex:1; min-width:0; font-size:1.1rem; font-weight:700;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { background:var(--accent); color:#fff; text-decoration:none;
         padding:10px 22px; border-radius:12px; font-weight:700; white-space:nowrap; }
</style>
</head>
<body>
<main id="apps"></main>

<script>
const base = "https://github.com/sa-ar-t/sa_github.io/releases/download/V1/";

const apps = [
  { name: "Sa_ph_5D", icon: "📘", file: "Sa_ph_5D.apk" },
  { name: "Sa_th_sn", icon: "📚", file: "Sa_th_sn.apk" }
];

const box = document.getElementById("apps");
apps.forEach(a => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML =
    '<div class="icon">' + a.icon + '</div>' +
    '<div class="name">' + a.name + '</div>' +
    '<a class="btn" href="' + base + a.file + '">تثبيت</a>';
  box.appendChild(el);
});
</script>
</body>
</html>
