<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تطبيقاتي</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c1e26; --sub:#6b7080; --accent:#2f6df6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1c1f28; --text:#eef0f6; --sub:#9aa0b2; --accent:#5b8cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
         background:var(--bg); color:var(--text); line-height:1.6; }
  header { text-align:center; padding:40px 16px 16px; }
  header h1 { margin:0 0 6px; font-size:1.8rem; }
  header p { margin:0; color:var(--sub); }
  main { max-width:720px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  .card { background:var(--card); border-radius:16px; padding:18px;
          box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; gap:14px; align-items:center; }
  .icon { width:56px; height:56px; border-radius:14px; background:var(--accent);
          color:#fff; display:flex; align-items:center; justify-content:center;
          font-size:1.5rem; flex-shrink:0; }
  .info { flex:1; min-width:0; }
  .info h2 { margin:0; font-size:1.1rem; }
  .info p { margin:2px 0 0; color:var(--sub); font-size:.9rem; }
  .btn { background:var(--accent); color:#fff; text-decoration:none;
         padding:10px 16px; border-radius:10px; font-weight:600; white-space:nowrap; }
  footer { text-align:center; color:var(--sub); padding:24px; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>تطبيقاتي</h1>
  <p>تطبيقات أندرويد مجانية، حمّلها مباشرة</p>
</header>

<main id="apps"></main>

<footer>© H</footer>

<script>
const base = "https://github.com/sa-ar-t/sa_github.io/releases/download/v1/";

// غيّر قيمة file لتطابق اسم ملف الـ APK في الـ Release بالضبط
const apps = [
  { name: "تطبيق الترجمة", desc: "ترجمة عربي / إنجليزي / فرنسي بدون إنترنت", icon: "🌐", file: "sa_ar_to_en.apk" },
  { name: "تطبيق البولار", desc: "تعلّم لغة البولار عبر العربية", icon: "📖", file: "sa_f.apk" },
  { name: "تطبيق الكتاب", desc: "كتب مدرسية موريتانية للدراسة", icon: "📚", file: "Sa_th_sn.apk" }
];

const box = document.getElementById("apps");
apps.forEach(a => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML =
    '<div class="icon">' + a.icon + '</div>' +
    '<div class="info"><h2>' + a.name + '</h2><p>' + a.desc + '</p></div>' +
    '<a class="btn" href="' + base + a.file + '">تحميل</a>';
  box.appendChild(el);
});
</script>
</body>
</html>
